name: GAME-SP1 targeted smoke

on:
  push:
    branches:
      - 'agent/game-sp1*'
      - 'agent/sp11d1*'
      - 'agent/sp11d2*'
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/assets/audio/dialogue/**'
      - 'public/assets/audio/dialogue/**'
      - 'tests/**'
      - 'scripts/preview-server.mjs'
      - 'scripts/build.mjs'
      - 'package.json'
      - '.github/workflows/game-sp1-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'scripts/preview-server.mjs'
      - 'scripts/build.mjs'
      - 'package.json'
      - '.github/workflows/game-sp1-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify game scripts and scene flow (no dependencies)
        run: npm run verify
      - name: Verify published output excludes project and personal documentation
        run: |
          test -f dist/index.html
          test -f dist/src/game.js
          test -f dist/src/reactions.js
          test -f dist/src/china-data.js
          test -f dist/public/assets/generated/locations/chapter-two-days-later-title-v01.webp
          test -f dist/public/assets/generated/locations/china-great-wall-background-v01.webp
          test -f dist/public/assets/generated/characters/stephen-holiday-standing-neutral-v01.webp
          test -f dist/public/assets/generated/characters/great-wall-summit-promoter-standing-v01.webp
          test -f dist/public/assets/generated/locations/china-forbidden-city-background-v01.webp
          test -f dist/public/assets/generated/characters/china-banquet-attendant-standing-v01.webp
          test -f dist/public/assets/generated/characters/stephen-holiday-forbidden-city-pleased-v01.webp
          test -f dist/public/assets/generated/locations/china-night-market-background-v01.webp
          test -f dist/public/assets/generated/characters/china-night-market-spa-representative-v01.webp
          test -f dist/public/assets/generated/characters/stephen-night-market-skewer-v01.webp
          test -f dist/src/styles.css
          test -f dist/public/assets/generated/locations/office-clean-01-v01.webp
          test -f dist/public/assets/generated/locations/office-foreground-01-v01.webp
          test -f dist/public/assets/generated/locations/office-exterior-opening-v01.webp
          test -f dist/public/assets/generated/characters/david-office-seated-neutral-v01.webp
          test -f dist/public/assets/generated/characters/david-office-seated-confident-v01.webp
          test -f dist/public/assets/generated/characters/david-office-seated-systems-expert-v01.webp
          test -f dist/public/assets/generated/characters/david-office-seated-shocked-v01.webp
          test -f dist/public/assets/generated/characters/david-office-seated-frustrated-v01.webp
          test -f dist/public/assets/generated/characters/david-office-seated-serious-v01.webp
          test -f dist/public/assets/generated/characters/stephen-office-seated-neutral-v01.webp
          test -f dist/public/assets/generated/characters/stephen-office-seated-amused-v01.webp
          test -f dist/public/assets/generated/characters/stephen-office-seated-confused-v01.webp
          test -f dist/public/assets/generated/characters/stephen-office-seated-annoyed-v01.webp
          test -f dist/public/assets/generated/characters/stephen-office-seated-exasperated-v01.webp
          test -f dist/public/assets/generated/characters/stephen-office-seated-laughing-v01.webp
          test -f dist/public/assets/generated/characters/paul-office-seated-neutral-v01.webp
          test -f dist/public/assets/generated/characters/paul-office-seated-confused-v01.webp
          test -f dist/public/assets/generated/characters/paul-office-seated-pleased-v01.webp
          test -f dist/public/assets/generated/characters/stephen-martin-baseline.webp
          test -f dist/public/assets/generated/characters/david-baseline.webp
          test -f dist/public/assets/generated/characters/paul-baseline.webp
          test ! -e dist/AGENTS.md
          test ! -e dist/docs
          test ! -e dist/.github
      - name: Package complete D1 office preview for visual review
        uses: actions/upload-artifact@v4
        with:
          name: game-sp11d2-stephen-expression-proof
          if-no-files-found: error
          retention-days: 14
          path: dist/
