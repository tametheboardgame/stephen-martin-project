# Temporary one-shot asset materialisation, removed before final V1 merge.
# Converts the EXACT owner-approved PNG to pixel-identical lossless WebP.
name: V1 one-shot approved finale lossless conversion
on:
  push:
    branches:
      - agent/v1-final-audit-optimisation
    paths:
      - .github/workflows/v1-once-convert-finale.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lossless-image:
    if: github.ref == 'refs/heads/agent/v1-final-audit-optimisation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert source PNG to exact-pixel lossless WebP
        run: |
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          from hashlib import sha256
          source=Path('public/assets/generated/locations/ending-c-finale-standee-celebration-v01.png')
          dest=source.with_suffix('.webp')
          assert sha256(source.read_bytes()).hexdigest() == '6c8bf0a4bd46d43c8997fa5ea1a2fe5c2edc453e7c099199b3946f42bcb00f18', 'Approved source PNG mismatch'
          image=Image.open(source).convert('RGB')
          assert image.size == (1672,941)
          image.save(dest, format='WEBP', lossless=True, method=6)
          decoded=Image.open(dest).convert('RGB')
          assert ImageChops.difference(image,decoded).getbbox() is None,'WebP not pixel-exact'
          assert dest.stat().st_size<source.stat().st_size,'lossless compression gave no benefit'
          print(f'Pixel identical, original={source.stat().st_size}, WebP={dest.stat().st_size}')
          PY
      - name: Commit approved lossless delivery derivative to optimisation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/generated/locations/ending-c-finale-standee-celebration-v01.webp
          git diff --cached --quiet && exit 0
          git commit -m 'V1: add pixel-identical lossless WebP for approved Ending C finale'
          git push origin HEAD:agent/v1-final-audit-optimisation
